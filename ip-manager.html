*{box-sizing:border-box}

.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}

.scroll{overflow-x:auto}

th{background:var(--chip);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0}

    if(!q)return true;
    return [i.name,i.ip,i.type,i.location,i.port,i.ae,i.host,i.mac,i.notes].some(v=>latin(v).toLowerCase().includes(q));
  });

/* ---------- import ---------- */
function parseDelimited(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const cnt=c=>(first.match(new RegExp(c==='\t'?'\t':'\\'+c,'g'))||[]).length;
  let d=',';if(cnt('\t')>0)d='\t';else if(cnt(';')>cnt(','))d=';';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch;
    }else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      row.push(cur);cur='';if(row.some(c=>c.trim()))rows.push(row);row=[];
    }else cur+=ch;
  }
  row.push(cur);if(row.some(c=>c.trim()))rows.push(row);
  return rows;
}
function setRows(rows){
  imp.rows=rows.map(r=>r.map(c=>String(c==null?'':c).trim()));
  if(!imp.rows.length){toast('الملف فاضي');return}
  $('#step2').style.display='block';
  autoMap();renderMap();
}
function autoMap(){
  const cols=Math.max(...imp.rows.slice(0,50).map(r=>r.length));
  const header=imp.rows[0].map(h=>latin(h).toLowerCase());
  const looksHeader=!header.some(h=>IP_RE.test(h));
  $('#hasHeader').checked=looksHeader;
  imp.map={};const taken=new Set();
  const order=['ip','mac','port','ae','host','gw','mask','vlan','name','type','location','notes'];
  if(looksHeader){
    order.forEach(k=>{
      const c=header.findIndex((h,i)=>!taken.has(i)&&HINTS[k].some(w=>h.includes(w)));
      if(c>=0){imp.map[k]=c;taken.add(c)}
    });
  }
  if(imp.map.ip==null){
    let best=-1,bc=0;
    for(let c=0;c<cols;c++){
      const n=imp.rows.slice(looksHeader?1:0,60).filter(r=>IP_RE.test(latin(r[c]||''))).length;
      if(n>bc){bc=n;best=c}
    }
    if(best>=0){imp.map.ip=best;taken.add(best)}
  }
  if(imp.map.name==null){
    const c=[...Array(cols).keys()].find(i=>!taken.has(i));
    if(c!=null)imp.map.name=c;
  }
}
function renderMap(){
  const cols=Math.max(...imp.rows.slice(0,50).map(r=>r.length));
  const hdr=$('#hasHeader').checked;
  const label=c=>hdr&&imp.rows[0][c]?imp.rows[0][c]:`عمود ${c+1}`;
  $('#map').innerHTML=FIELDS.map(f=>{
    let o='<option value="">— تجاهل —</option>';
    for(let c=0;c<cols;c++)o+=`<option value="${c}" ${imp.map[f.k]===c?'selected':''}>${esc(label(c))}</option>`;
    return `<div><label style="font-size:13px;color:var(--muted)">${f.l}</label><select data-map="${f.k}">${o}</select></div>`;
  }).join('');
  const body=imp.rows.slice(hdr?1:0,(hdr?1:0)+5);
  $('#prev').innerHTML='<table><tbody>'+body.map(r=>'<tr>'+[...Array(cols).keys()].map(c=>`<td>${esc(r[c]||'')}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
}
function doImport(){
  const hdr=$('#hasHeader').checked;
  const mode=document.querySelector('input[name=mode]:checked').value;
  const skip=$('#skipExisting').checked;
  if(imp.map.ip==null){toast('اختار عمود الـ IP الأول');return}
  const base=mode==='replace'?[]:items.slice();
  const seen=new Set(base.map(dupKey));
  let added=0,skipped=0,bad=0;
  imp.rows.slice(hdr?1:0).forEach(r=>{
    const g=k=>imp.map[k]!=null?(r[imp.map[k]]||'').trim():'';
    let ip=latin(g('ip'));
    const m=ip.match(IP_RE);if(m)ip=m[0];
    if(!ip&&!g('name'))return;
    if(!ip)return;
    const pk=ip+'|'+g('port');if(skip&&seen.has(pk)){skipped++;return}
    if(!isIp(ip))bad++;
    base.push({id:uid(),name:g('name'),ip,type:g('type'),location:g('location'),port:g('port'),ae:g('ae'),host:g('host'),mac:normMac(g('mac')),mask:g('mask'),gw:g('gw'),vlan:g('vlan'),notes:g('notes')});
    seen.add(pk);added++;
  });
  if(mode==='replace'&&!confirm('هيتم استبدال كل البيانات الحالية. متأكد؟'))return;
  const warn=base.slice(base.length-added).filter(x=>probs(x,{},{}).length).length;
  if(warn&&!confirm(`${warn} صف فيه بيانات غير صالحة (IP/Port/MAC/Mask). تستورد برضه؟`))return;
  items=base;save();addLog('استيراد',{name:'ملف',ip:''},added+' جهاز');render();
  $('#mImport').classList.remove('open');
  toast(`تم استيراد ${added}${skipped?` — تخطي ${skipped} موجود`:''}${bad?` — ${bad} غير صالح`:''}`);
}
function readFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  const fr=new FileReader();
  if(['csv','txt','tsv'].includes(ext)){
    fr.onload=()=>setRows(parseDelimited(fr.result));
    fr.readAsText(f,'utf-8');
  }else{
    if(typeof XLSX==='undefined'){toast('مكتبة Excel مش متحملة (محتاج نت) — جرّب CSV أو اللصق');return}
    fr.onload=()=>{
      try{
        imp.wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
        const names=imp.wb.SheetNames;
        $('#sheetRow').style.display=names.length>1?'block':'none';
        $('#sheetSel').innerHTML=names.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');
        loadSheet(0);
      }catch(e){toast('تعذر قراءة الملف')}
    };
    fr.readAsArrayBuffer(f);
  }
}
function loadSheet(i){
  const ws=imp.wb.Sheets[imp.wb.SheetNames[i]];
  setRows(XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}));
}

async function sha(v){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('teba:'+v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return null}}
const mkAcc=async(n,s,v,x)=>({n,s,x:x||'',hl:H(v),hs:(await sha(v))||''});
async function pb(v,saltHex,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(v),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(saltHex.match(/../g),h=>parseInt(h,16)),iterations:it,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function who(v){
  const A=window.TEBA_ACCESS;if(!v||!A||!window.crypto||!crypto.subtle)return null;
  const today=new Date().toISOString().slice(0,10),it=A.it||150000;
  if(A.admin&&await pb(v,A.admin.salt,it)===A.admin.h)return{admin:1,n:'الأدمن'};
  for(const a of A.accounts||[]){if(a.x&&a.x<today)continue;if(await pb(v,a.salt,it)===a.h)return{n:a.n,s:a.sec==='print'?'dprint':a.sec}}
  return null}
async function whoLocal(v){const l=H(v),sh=await sha(v),today=new Date().toISOString().slice(0,10),m=a=>a.hl===l&&(!a.hs||sh===null||a.hs===sh);
  if(m(auth.adm))return{admin:1,n:'الأدمن'};

function mkPdf(jp,W,H){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length};
  const obj=(n,f)=>{offs[n]=len;push(n+' 0 obj\n');f();push('\nendobj\n')};
  const N=jp.length,PW=595,PH=842;push('%PDF-1.4\n');
  obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>push('<</Type/Pages/Count '+N+'/Kids['+jp.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>'));
  jp.forEach((j,i)=>{const p=3+3*i,c=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(p,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]/Resources<</XObject<</Im${i} ${p+2} 0 R>>>>/Contents ${p+1} 0 R>>`));
    obj(p+1,()=>push(`<</Length ${c.length}>>\nstream\n${c}\nendstream`));
    obj(p+2,()=>{push(`<</Type/XObject/Subtype/Image/Width ${W}/Height ${H}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.length}>>\nstream\n`);push(j);push('\nendstream')})});
  const xr=len,tot=3+3*N;push('xref\n0 '+tot+'\n0000000000 65535 f \n');
  for(let n=1;n<tot;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<</Size ${tot}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}
function shareText(l,title){if(!l.length){toast('مفيش أجهزة للمشاركة');return}
  title=title||(st.sec==='home'?SEC[secOf(l[0])].t:SEC[st.sec].t);
  const cols=[['الاسم','name',.30],['IP','ip',.22],['Port','port',.10],['AE Title','ae',.20],['Host','host',.18]],W=1240,H=1754,M=60,RH=58,per=24,pages=Math.ceil(l.length/per),jp=[],F='Tahoma,sans-serif';
  for(let p=0;p<pages;p++){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,W,H);x.direction='rtl';x.textBaseline='middle';x.textAlign='right';
    x.fillStyle='#0a1a3a';x.font='bold 44px '+F;x.fillText('مركز طيبة للأشعة — '+title,W-M,90);
    x.fillStyle='#555';x.font='24px '+F;x.fillText(new Date().toLocaleDateString('ar-EG')+'  —  '+(p+1)+'/'+pages,W-M,140);
    let y=190;const tw=W-2*M;x.fillStyle='#0c2a5e';x.fillRect(M,y,tw,RH);x.fillStyle='#fff';x.font='bold 26px '+F;
    let cx=W-M;cols.forEach(([h,,f])=>{x.fillText(h,cx-12,y+RH/2);cx-=tw*f});
    l.slice(p*per,(p+1)*per).forEach((it,r)=>{y+=RH;if(r%2){x.fillStyle='#eef4ff';x.fillRect(M,y,tw,RH)}
      x.fillStyle='#111';x.font='26px '+F;cx=W-M;cols.forEach(([,k,f])=>{x.fillText(String(it[k]||''),cx-12,y+RH/2,tw*f-20);cx-=tw*f});x.strokeStyle='#ccd';x.strokeRect(M,y,tw,RH)});
    jp.push(Uint8Array.from(atob(c.toDataURL('image/jpeg',.92).split(',')[1]),ch=>ch.charCodeAt(0)))}
  const f=new File([mkPdf(jp,W,H)],'teba-'+title.replace(/\s+/g,'-')+'.pdf',{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title}).catch(()=>{});
  else{dl(f,f.name);toast('اتحفظ PDF — ابعته من الملفات على واتساب')}}
