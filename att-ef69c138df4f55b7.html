/* ---------- conflict detection ---------- */
const CF_LONG=960;
function confl(n,k){
 const mn0=MAN[n+'|'+k];if(mn0&&!(mn0.early&&!mn0.i&&!mn0.o))return [];
 const pr=(PR[n]||{})[k]||{i:[],o:[]},loc=(DATA[n]||{})[k]||[],out=[];
 const I=[...pr.i].sort((a,b)=>a-b),O=[...pr.o].sort((a,b)=>a-b),f=a=>a.map(m=>fT(m)).join(' · ');
 const both=[...new Set(I.filter(m=>O.includes(m)))];
 if(both.length)out.push(['both',f(both)]);
 if(loc.length>2)out.push(['many',loc.length+' ← '+loc.map(m=>fT(m)).join(' · ')]);
 const ss=[...(loc.length?[loc[0]]:[]),...I],ci=ss.length?Math.min(...ss):null;
 const ee=[...(loc.length?[loc[loc.length-1]]:[]),...O],lo=ee.length?Math.max(...ee):null;
 const seq=[...I.map(m=>[m,'i']),...O.map(m=>[m,'o'])].sort((a,b)=>a[0]-b[0]||(a[1]=='i'?-1:1)),dI=[],dO=[];
 for(let j=1;j<seq.length;j++)if(seq[j][1]==seq[j-1][1])(seq[j][1]=='i'?dI:dO).push(fT(seq[j-1][0])+' / '+fT(seq[j][0]));
 if(dI.length)out.push(['dupI',dI.join(' | ')]);
 if(dO.length)out.push(['dupO',dO.join(' | ')]);
 if(ci!=null&&lo!=null&&lo-ci>CF_LONG)out.push(['long',fT(ci)+' → '+fT(lo)+' ('+(Math.round((lo-ci)/6)/10)+')']);
 const e0=EMP.find(x=>x.n===n);
 if(e0&&ci!=null){
  const sc=dayS(e0,k,new Date(k+'T00:00:00').getDay());
  if(sc.on){const st=toMin(sc.s);let en=toMin(sc.e);if(en<=st)en+=1440;
   if(!(mn0&&mn0.early)&&((ci>=en&&I.length)||(lo!=null&&lo<=st)))out.push(['outside',fT(ci)+(lo!=null?' – '+fT(lo):'')+' ≠ '+sc.s+'–'+sc.e])}
 }
 return out;
}
function allConf(f,t){

  new Set([...Object.keys(DATA[e.n]||{}),...Object.keys(PR[e.n]||{})]).forEach(k=>{if(k<f||k>t)return;const c=confl(e.n,k);if(c.length)out.push({ix,k,c})})});
 return out.sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:0);
}

["جدول تفاصيل الموظف","جنب كل يوم متأخر أو غياب زر 🔍 توقيع نصي وزر 🔄 تبديل. والضغط على التاريخ نفسه بيفتح ورقة اليوم."]]},
{i:"📐",t:"طريقة الحساب",u:1,l:[
["يوم العمل","بيتحدد حسب وردية كل موظف مش قاعدة واحدة للكل. الموظف النهاري: أي وقت قبل ٤ الفجر (أو قبل بداية ورديته بنص ساعة لو بتبدأ بدري) بيتحسب لليوم اللي قبله. والموظف اللي ورديته الليلية بتخلص الصبح بيمتد عنده اليوم لحد ساعتين بعد نهاية الوردية."],
["الحضور","أول لوكيشن في يوم العمل، أو توقيع الحضور لو أبكر."],
["الانصراف","آخر لوكيشن أو توقيع انصراف، بشرط تكون المدة بعد الحضور ساعة على الأقل ونص ساعات اليوم المطلوبة على الأقل، وإلا اليوم بيتحسب من غير انصراف."],
["بلا حضور","يوم فيه توقيع انصراف بس ومفيش لوكيشن ولا توقيع حضور. بيظهر بحالة (بلا حضور)، وما بيتحسبش حضور ولا غياب، وليه عمود وكارت لوحده."],
["التأخير والخروج المبكر","التأخير = الحضور بعد ميعاد البداية بأكتر من دقايق السماح. الخروج المبكر = قبل النهاية بأكتر من السماح."],
["الساعات","الفعلية والناقصة بتتحسب في الأيام اللي لها انصراف بس."],
["الغياب","يوم عمل من غير أي تسجيل، من أول سجل للموظف لحد اليوم اللي قبل آخر يوم في البيانات."],
["الجداول","بتتطبق على كل التواريخ. التبديل بيغيّر اليوم المحدد بس."]]},
{i:"🛡️",t:"النسخ الاحتياطي والاستعادة",l:[
["الزر","💾 نسخ احتياطي فوق جنب (خصائص). بتظهر عليه نقطة حمرا لما يكون فيه تغييرات بعد آخر نسخة، أو لو ما اتعملتش نسخة أصلاً."],
["حفظ نسخة كاملة","ملف واحد فيه الموظفين وجداولهم وملفات واتساب المضافة (الرسائل والبصمات) وعلامات التوقيع النصي وتبديلات المواعيد والتعديلات اليدوية والاعتمادات والإعدادات. أول ما يتحفظ البرنامج بيفتحه ويقارنه بالبيانات الحالية ويقولك لو فيه مشكلة."],
["التشفير","النسخة مشفّرة. محتاج نفس ملف البرنامج ونفس الرقم السري عشان تفتحها، فاحتفظ بيهم مع النسخة. الملف المثبّت جوه البرنامج مش داخل فيها لأنه جوه الملف نفسه."],
["الاستعادة","اختار ملف النسخة. البرنامج بيختبره الأول: بيفتحه ويتأكد من سلامته ويعرض اللي جواه ومقارنته بالحالي. وبعدين تضغط (تنفيذ الاستعادة)."],
["قبل الاستبدال","الاستعادة بتستبدل البيانات الحالية. فيه خيار (احفظ نسخة من الحالي قبل الاستبدال) متفعّل تلقائي، وبينزّل نسخة من الحالي قبل ما يبدّل."],
["تغيير الجهاز أو المتصفح","افتح البرنامج بنفس الملف والرقم السري على الجهاز أو المتصفح الجديد، واضغط 💾 نسخ احتياطي ثم استعادة واختار آخر نسخة."],
["ملف الإعدادات القديم","(حفظ الإعدادات) في تاب الموظفين بيحفظ الإعدادات بس من غير رسائل واتساب. تقدر تستعيده من نفس زر الاستعادة، والملفات الحالية بتفضل زي ما هي."],
["تخزين دائم","البرنامج بيطلب من المتصفح ما يمسحش بياناته، وبيعرض في نافذة النسخ لو اتفعّل. ده مش ضمان، فالنسخة الاحتياطية هي الأمان الحقيقي."],
["نصيحة","انسخ الملف على Drive أو ابعته لنفسك على واتساب، وخصوصاً بعد أي إضافة كبيرة."]]},
{i:"🔐",t:"الصلاحيات والإعدادات",u:1,l:[
["القفل","البرنامج بيتفتح برقم سري. فيه صلاحية كاملة وصلاحية عرض التقارير بس."],
["اللغة","زر اللغة فوق بيبدّل بين العربي والإنجليزي."],
["الوضع الليلي","بيتغير تلقائي حسب إعدادات جهازك."],
["التقويم والتواريخ","الأسبوع بيبدأ من السبت في كل التقاويم، ومنتقي التواريخ (من / إلى والتبديل وفلتر الرسائل)، وفي ترتيب الأيام في الجداول."],
["مكان الحفظ","الإعدادات والتبديلات والعلامات بتتحفظ في متصفح الجهاز ده. خد نسخة كاملة من زر 💾 نسخ احتياطي قبل ما تغيّر الجهاز أو تمسح بيانات المتصفح."]]}
],
en:[
{i:"🚀",t:"Quick start",l:[
["1) Employees","In the 👥 tab add employees and set their schedules. The name must match the sender name in the WhatsApp group exactly."],
["2) WhatsApp files","Export the chat from WhatsApp without media and add the zip or txt file in the 💬 tab."],
["3) Reports","Open the 📊 tab for the dashboard and reports. Tap any day or employee for details."],
["4) Text sign-off","If someone sends a message like (arrived) or (leaving), mark it as check-in or check-out in the 📝 tab."],
["5) Backup","Press 💾 Backup (top) and save a full copy now and then, somewhere else. Everything is stored in this browser on this device only."]]},
{i:"👥",t:"Employees & schedules",l:[
["Add and delete","(+ Add employee) adds one. Tick the ones to remove and press Delete selected."],
["Name and display name","The name must match the WhatsApp sender. The display name is optional and is what appears in reports and PDFs."],
["Renaming a WhatsApp name","When you rename an employee a warning shows what is affected: shift swaps, text sign-off marks, manual edits and chat records. You can update the links automatically or rename only. Chat records link by the WhatsApp name only, so if the new name is not the sender name they get detached from the employee."],
["Category","MRI, CT, Secretarial, Cashier or none. Departments are grouped by it in the dashboard and reports."],
["Schedule","Open Schedule for each employee and set work days, start, end and hours per day. You can set all days at once. Night shifts that end the next day are supported."],
["Display","Group by category or flat list, expand or collapse all."],
["Employee summary","A table with name, phone, category, in/out times, hours and days off for everyone, with print and a button to hide phone numbers."],
["Reset defaults","Restores the original built-in employees."],
["Save and load settings","A file with employees, schedules, text sign-off marks and shift swaps. All of them are also kept automatically in the browser."]]},
{i:"🔄",t:"Shift swap",l:[
["From the Employees tab","Pick the date (and To for several days) and both employees. Each is calculated on the other's schedule for those days only."],
["For past days","From a report: next to the day in the employee details, calendar or day sheet, press 🔄 Swap and pick who swapped."],
["Undo","Pressing 🔄 on a swapped day offers to delete the swap. The swap list also has a delete button."],
["Rules","A swap is saved for both people at once, and an employee cannot be in two overlapping swaps. The 🔄 mark appears on the day in reports and PDFs."],
["Note","If you rename an employee (WhatsApp name) after saving a swap, the old swap loses its link. Delete it and add it again."]]},
{i:"💬",t:"WhatsApp files",l:[
["Adding a file","zip or txt from a chat export without media. You can pick several files at once. Before merging the (Import preview) appears."],
["Import preview","For each file it shows how many records are new, duplicate and rejected, why they were rejected (invalid date, future date or empty sender), the new dates and senders that are not in the employee list. Nothing is merged until you press Merge."],
["Duplicate protection","Importing the same chat file again (or a file containing part of the old one) never counts a punch or message twice. A file identical to an existing one is ignored."],
["Diff report","Before merging the app computes the report before and after and shows the employees whose present, late, absent, no check-in or hours changed, and the days that changed. After merging, (📋 Last diff report) reopens it until you close the app."],
["What is read","Sender names, live-location times and text messages. No media."],
["Use and delete","The checkbox next to a file turns it on or off. Delete works for files you added; the built-in file cannot be deleted."],
["New senders","The button (Add senders not in the employee list) adds them with a default 9 AM to 5 PM schedule and Friday off. Edit it afterwards."]]},
{i:"📝",t:"Messages & text sign-off",l:[
["List and filters","All text messages with search and filters by sender, status (all, unmarked, check-in, check-out, deleted) and date."],
["Mark check-in or check-out","Select messages (or Select all) and press the mark button. They become a text sign-off that is merged into the calculation."],
["How it merges","Check-in = earliest time between location and sign-off. Check-out = latest time between them."],
["Assign to employee","(Assign selected to employee) credits the sign-off to someone other than the sender. Default is the sender if they are in the list."],
["Auto-detect","Marks messages with words like arrived, here (check-in) and left, leaving (check-out), and Arabic equivalents. It asks before applying."],
["Delete and restore","Useless messages can be deleted and are not counted. Restore them from the Deleted filter."],
["From a report","The 🔍 Text sign-off button next to a late or absent day, and 💬 Day messages in the day sheet, open that day's messages directly."],
["PDF","Export the current list, or sign-offs only."]]},
{i:"📊",t:"Dashboard",u:1,l:[
["Periods","Latest day, week, month or all. All are counted from the last day in the data, not from today's date."],
["Cards","Complete attendance, late, absent, no check-in, early leave, days with no check-out, conflicts and work hours."],
["Attendance donut","Rate = present ÷ (present + absent). Green on time, orange late, red absent."],
["Chart by day","A bar per day, grouped by month when the period is longer than 31 days."],
["Department cards","Per category: employee count, on time, late and absent."],
["Logged in","Latest-day mode only: a list with in/out times and status for each employee."],
["Needs review","Most recent days with lateness, early leave, missing check-out or absence. Tap any item for the day details."],
["Note","Absence is counted once the day is over, so the last day in the data shows no absences."]]},
{i:"⚠️",t:"Conflict detection",u:1,l:[
["Repeats","Two check-ins or two check-outs in a row with none of the other kind between them. In, out, in, out again (a break) is not a conflict."],
["One message, both marks","A single message marked as both check-in and check-out."],
["Outside the shift","A check-in after the scheduled shift ended, or a check-out before it started. Usually a wrong shift or an unrecorded swap."],
["Span over 16 hours","Between the first check-in and last check-out. Usually a forgotten check-out or a sign-off on the wrong day."],
["Where it shows","A card and a list in the dashboard, a ⚠️ in the calendar and table, and a red box in the day sheet. The All button scans all data."],
["Fix","Open Day messages from the day sheet and correct the in/out marks."]]},
{i:"📅",t:"Monthly grid, calendar & day sheet",u:1,l:[
["Team monthly grid","In the All employees view: a row per employee, a column per day with colored squares, present/late/absent columns, and a present-count row."],
["Employee calendar","In the Employee view: the month with colored days. ! means check-in without out, 🔄 a swap, ⚠️ a conflict."],
["Colors","Green present, orange late, red absent, gray day off, dashed red (∅) no check-in."],
["Day sheet","Tap any day (calendar, grid or list): shift, in, out, late, early leave, hours, shortage, and all recorded messages and sign-offs."],
["Source of each time","Next to the check-in and check-out time an icon shows where it came from: 📍 live location, 💬 approved text message (text sign-off), ✏️ manual edit. It appears in the employee details, the day sheet and PDFs."],
["Manual edit","From the day sheet press ✏️ Manual edit and enter the correct check-in and/or check-out time with a note. It replaces the recorded times for that day only, no conflicts are raised for that day, and it is kept in the backup. Remove it to bring the original times back."],
["Arrows","Change the month, shared between the monthly grid and the calendar."]]},
{i:"📈",t:"Reports & export",u:1,l:[
["Range","From and To, plus shortcuts: All, This year, This month, Last month."],
["View","All employees or one employee, category filter, and grouping by day, month or year."],
["Grace minutes","Lateness and early leave count only beyond these minutes."],
["🏆 Discipline ranking","Ranks employees by an attendance percentage, with present, late, late minutes, early leave and absent counts. Has a print button."],
["👁 Hide names","Replaces names with numbers for display or printing."],
["✅ Review before approval","Scans the chosen range and lists: days without check-in or check-out, conflicts, days with no data for anyone (the file may not cover them), scheduled employees with no records (often a wrong WhatsApp name) and messages that look like check-in/out but are not marked. Then (Approve this report) records the range, the time and a fingerprint of the data, and later shows whether the data changed after approval."],
["PDF","Overall, this employee, or a page per employee. The 🔄 mark appears on swapped days."],
["Employee details table","Next to each late or absent day there is a 🔍 Text sign-off button and a 🔄 Swap button. Tapping the date itself opens the day sheet."]]},
{i:"📐",t:"How it is calculated",u:1,l:[
["Work day","Set per employee shift, not one rule for everyone. Day-shift employee: any time before 4 AM (or half an hour before an early shift starts) counts for the previous day. For a night shift that ends in the morning, the day extends up to two hours after the shift end."],
["Check-in","The first location in the work day, or the sign-in if earlier."],
["Check-out","The last location or sign-out, provided the span after check-in is at least one hour and at least half of the day's required hours. Otherwise the day counts as no check-out."],
["No check-in","A day with a sign-out only and no location or sign-in. It shows as (No check-in), counts as neither present nor absent, and has its own column and card."],
["Late and early leave","Late = check-in after the start time by more than the grace minutes. Early leave = before the end time by more than the grace."],
["Hours","Actual and shortage hours count only on days that have a check-out."],
["Absence","A work day with no record, from the employee's first record up to the day before the last day in the data."],
["Schedules","Apply to all dates. A swap changes only the chosen days."]]},
{i:"🛡️",t:"Backup & restore",l:[
["The button","💾 Backup at the top next to Features. A red dot shows when there are changes since the last backup, or if no backup was ever made."],
["Save a full backup","One file with employees and schedules, added WhatsApp files (messages and punches), text sign-off marks, shift swaps, manual edits, approvals and settings. As soon as it is saved the app opens it, compares it with the current data and tells you if something is wrong."],
["Encryption","The backup is encrypted. You need the same program file and the same PIN to open it, so keep them together with the backup. The built-in file is not included because it is inside the program file itself."],
["Restore","Pick the backup file. The app tests it first: it opens it, checks integrity and shows what is inside compared to the current data. Then press Run restore."],
["Before replacing","Restore replaces the current data. The option (Save a copy of the current data before replacing) is on by default and downloads the current state before replacing."],
["New device or browser","Open the app with the same file and PIN on the new device or browser, press 💾 Backup then Restore and pick the latest backup."],
["Old settings file","(Save settings) in the Employees tab saves settings only, without WhatsApp messages. You can restore it from the same Restore button, and the current files stay as they are."],
["Persistent storage","The app asks the browser not to clear its data and shows in the backup window if it was granted. It is not a guarantee, so the backup is the real safety net."],
["Tip","Copy the file to Drive or send it to yourself on WhatsApp, especially after any big addition."]]},
{i:"🔐",t:"Access & settings",u:1,l:[
["Lock","The app opens with a PIN. There is full access and a reports-only access."],
["Language","The button at the top switches between Arabic and English."],
["Dark mode","Follows your device setting automatically."],
["Calendars and dates","The week starts on Saturday in every calendar, the date picker (From / To, shift swap and message filter), and in the order of days in schedules."],
["Where data is kept","Settings, swaps and marks are kept in this device's browser. Take a full copy with the 💾 Backup button before changing devices or clearing browser data."]]}
]};
function guideFind(q){
 q=q.trim().toLowerCase();let any=false;
 document.querySelectorAll('#gdb details').forEach(d=>{
  const st=d.querySelector('summary').textContent.toLowerCase();let m=0;
  d.querySelectorAll('.gi').forEach(i=>{const hit=!q||st.includes(q)||i.textContent.toLowerCase().includes(q);i.style.display=hit?'':'none';if(hit)m++});
  d.style.display=m?'':'none';if(q&&m)d.open=true;if(m)any=true});
 document.getElementById('gdn').style.display=any?'none':'';
}
function closeGuide(){const o=document.getElementById('gdov');if(o)o.remove()}
function openGuide(){
 closeGuide();
 const G=(GUIDE[lang]||GUIDE.ar).filter(s=>window.ROLE!=='u'||s.u);
 const o=document.createElement('div');o.id='gdov';
 o.style.cssText='position:fixed;inset:0;z-index:9997;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center';
 o.innerHTML=`<div class="card" style="width:min(100%,640px);margin:0;border-radius:20px 20px 0 0;height:92vh;display:flex;flex-direction:column;padding:0"><div style="padding:14px 14px 8px"><div class="row" style="justify-content:space-between;margin:0 0 8px"><h2 style="margin:0">${tr('gd_h')}</h2><button class="s sm" onclick="closeGuide()">${tr('close')}</button></div><input id="gdq" style="width:100%" placeholder="${tr('gd_s')}" oninput="guideFind(this.value)"></div><div id="gdb" style="overflow:auto;flex:1;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px))">`
  +G.map((s,n)=>`<details class="gdd"${n==0?' open':''}><summary>${s.i} ${s.t}</summary>`+s.l.map(([a,b])=>`<div class="gi"><b>${a}</b><div>${b}</div></div>`).join('')+`</details>`).join('')
  +`<div class="mut" id="gdn" style="display:none;text-align:center;padding:14px">${tr('gd_none')}</div></div></div>`;
 o.onclick=ev=>{if(ev.target===o)closeGuide()};
 document.body.appendChild(o);
}

function bkDirty(){try{localStorage.setItem('att_bkd','1')}catch(e){}const b=document.getElementById('bkbtn');if(b)b.classList.add('dirty')}
function bkClean(at){try{localStorage.setItem('att_bk',JSON.stringify({at}));localStorage.setItem('att_bkd','0')}catch(e){}const b=document.getElementById('bkbtn');if(b)b.classList.remove('dirty')}
function bkInit(){let l=null;try{l=localStorage.getItem('att_bk')}catch(e){}let d='1';try{d=localStorage.getItem('att_bkd')}catch(e){}const b=document.getElementById('bkbtn');if(b)b.classList.toggle('dirty',!l||d==='1');try{if(window.ROLE!=='u'&&navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
function bkSnap(){
 return {app:'attendance-report',v:5,at:new Date().toISOString(),grace:+$('#gr').value||0,emp:EMP,sw:SW,tf:TF,man:MAN,appr:APPR,
  files:FILES.filter(f=>!f.b).map(({id,name,s,e,xs,x})=>({id,name,s,e,xs,x})),
  use:Object.fromEntries(FILES.map(f=>[f.id,f.use])),
  prefs:{lang,grp:GRP?'1':'0',fold:[...FOLD],hn:window.HN?'1':'0'}};
}
const bkSum=j=>hsh(JSON.stringify((j.v||0)>=5?[j.emp,j.sw,j.tf,j.files,j.use,j.grace,j.man,j.appr]:[j.emp,j.sw,j.tf,j.files,j.use,j.grace]));
function bkStats(j){
 let ev=0,msg=0,a=1e12,z=0;
 (j.files||[]).forEach(f=>{(f.e||[]).forEach(r=>r.forEach(v=>{ev++;if(v<a)a=v;if(v>z)z=v}));msg+=(f.x||[]).length});
 return {emp:(j.emp||[]).length,sch:(j.emp||[]).filter(e=>e.days?e.days.some(d=>d.on):1).length,files:(j.files||[]).length,ev,msg,tf:Object.keys(j.tf||{}).length,sw:(j.sw||[]).length,man:Object.keys(j.man||{}).length,grace:j.grace||0,range:ev?vdate(a)+' → '+vdate(z):''};
}
function bkPack(){const j=bkSnap();j.sum=bkSum(j);return JSON.stringify({app:'attendance-report',format:2,enc:AC.enc(JSON.stringify(j))})}
function bkLegacy(s){const p=prompt(tr('bk_pin'));if(!p)throw 'dec';try{return AC.decWithPin(s,p.trim(),PSALT,WA)}catch(e){throw 'dec'}}
function bkOpen(text){
 let o;try{o=JSON.parse(text)}catch(e){throw 'file'}
 let enc=false;
 if(o&&typeof o==='object'&&o.enc){let inner;try{inner=AC.dec(o.enc)}catch(e){inner=bkLegacy(o.enc)}try{o=JSON.parse(inner)}catch(e){throw 'file'}enc=true}
 if(!o||typeof o!=='object'||!Array.isArray(o.emp))throw 'file';
 if(o.emp.some(e=>!e||typeof e.n!=='string'||(e.days&&(!Array.isArray(e.days)||e.days.length!==7))))throw 'file';
 const partial=!Array.isArray(o.files);
 if(!partial){
  const num=a=>Array.isArray(a)&&a.every(v=>typeof v==='number');
  if(o.files.some(f=>!f||typeof f.id!=='string'||!Array.isArray(f.s)||!Array.isArray(f.e)||f.s.length!==f.e.length||!f.e.every(num)||!Array.isArray(f.xs)||!Array.isArray(f.x)||f.x.some(t=>!Array.isArray(t)||t.length<3)))throw 'file';
 }
 if(o.sw!=null&&(!Array.isArray(o.sw)||o.sw.some(w=>!w||typeof w.f!=='string'||typeof w.t!=='string'||typeof w.a!=='string'||typeof w.b!=='string')))throw 'file';
 if(o.tf!=null&&(typeof o.tf!=='object'||Array.isArray(o.tf)))throw 'file';
 if(o.man!=null&&(typeof o.man!=='object'||Array.isArray(o.man)))throw 'file';
 if(o.appr!=null&&!Array.isArray(o.appr))throw 'file';
 if(o.sum&&bkSum(o)!==o.sum)throw 'sum';
 return {j:o,partial,enc,sum:!!o.sum};
}
function bkApply(j,partial){
 EMP=j.emp.map(mig);save();
