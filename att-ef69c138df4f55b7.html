const L=document.getElementById('pinlock'),I=document.getElementById('pinin'),E=document.getElementById('pinerr');
window.pinGo=function(){
 E.style.color='#555';E.textContent='جارٍ التحقق...';
 setTimeout(()=>{
  let role=null;
  try{AC.unlock(I.value.trim(),PSALT)}catch(e){}
  for(const [r,w] of [['a',WA],['u',WU]]){try{AC.useKey(AC.dec(w));role=r;break}catch(e){}}
  if(role){try{window.BI=JSON.parse(AC.dec(BIENC))}catch(e){role=null}}
  if(!role){E.style.color='#c00';E.textContent='الرقم السري غلط';I.value='';I.focus();return}
  window.ROLE=role;L.style.display='none';window.boot()
 },40)
};
I.addEventListener('keydown',e=>{if(e.key==='Enter')pinGo()});
setTimeout(()=>I.focus(),100);
})();
</script>

function parse(txt){
 const head=/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPpصم]\.?[Mm]?\.?)?\s*-\s*(.*)$/;

 for(const l0 of txt.split(/\r?\n/)){
  const l=l0.replace(/[\u200e\u200f\u202a-\u202e]/g,''),m=head.exec(l);
  if(m){
   const s=/^([^:]+?): ([\s\S]*)$/.exec(m[7]);
   if(s){cur={m,n:s[1].trim(),b:s[2]};raw.push(cur);if(+m[1]>12)dm=true;if(+m[2]>12)md=true}else cur=null;
  }else if(cur)cur.b+='\n'+l;
 }
 const dmy=dm&&!md,ev=[],tx=[];
 for(const r of raw){const m=r.m;
  let d=+(dmy?m[1]:m[2]),mo=+(dmy?m[2]:m[1]),y=+m[3];if(y<100)y+=2000;
  let h=+m[4];if(m[6]){const pm=/^[Ppم]/.test(m[6]);h=h%12+(pm?12:0)}
  const o={n:r.n,y,mo,d,h,mi:+m[5]},lines=r.b.split('\n');let body=r.b.trim();
  if(/^live location shared/i.test(lines[0].trim())){ev.push(o);body=lines.slice(1).join('\n').trim()}
  if(!body||/^<?media omitted>?$/i.test(body)||/^(this message was deleted|you deleted this message|null)$/i.test(body)||/\(file attached\)$/i.test(body.split('\n')[0]))continue;
  tx.push({...o,x:body});
 }
 return {ev,tx,dmy};
}

function cutOf(n){

    const lt=ci!=null?ci-st:0,ea=co!=null?en-co:0,wk2=ci!=null&&co!=null?(co-ci)/60:null,sh=wk2!=null?Math.max(0,sc.h-wk2):0,isL=lt>gr,isE=ea>gr;

function agg(rows){

  else if(s=='miss'){a.m++;a.md.push(r[0])}else if(s=='noin'){if(r[16]){a.ns++;a.p++}else a.ni++}
  if(s=='late'||s=='ok'||s=='noin'){const hi=r[3]!=='-',ho=r[4]!=='-';
   if(hi&&ho)a.f++;else if(hi)a.io++;else if(ho)a.oo++;
   if(r[18])a.ei++;if(r[19])a.e++;if(r[17])a.lo++}}

/* ---------- conflict detection ---------- */
const CF_LONG=960;
function confl(n,k){
 const mn0=MAN[n+'|'+k];if(mn0&&!(mn0.early&&!mn0.i&&!mn0.o))return [];
 const pr=(PR[n]||{})[k]||{i:[],o:[]},loc=(DATA[n]||{})[k]||[],out=[];
 const I=[...pr.i].sort((a,b)=>a-b),O=[...pr.o].sort((a,b)=>a-b),f=a=>a.map(m=>fT(m)).join(' · ');
 const both=[...new Set(I.filter(m=>O.includes(m)))];
 if(both.length)out.push(['both',f(both)]);
 if(loc.length>2)out.push(['many',loc.length+' ← '+loc.map(m=>fT(m)).join(' · ')]);
 const ss=[...(loc.length?[loc[0]]:[]),...I],ci=ss.length?Math.min(...ss):null;
 const ee=[...(loc.length?[loc[loc.length-1]]:[]),...O],lo=ee.length?Math.max(...ee):null;
 const seq=[...I.map(m=>[m,'i']),...O.map(m=>[m,'o'])].sort((a,b)=>a[0]-b[0]||(a[1]=='i'?-1:1)),dI=[],dO=[];
 for(let j=1;j<seq.length;j++)if(seq[j][1]==seq[j-1][1])(seq[j][1]=='i'?dI:dO).push(fT(seq[j-1][0])+' / '+fT(seq[j][0]));
 if(dI.length)out.push(['dupI',dI.join(' | ')]);
 if(dO.length)out.push(['dupO',dO.join(' | ')]);
 if(ci!=null&&lo!=null&&lo-ci>CF_LONG)out.push(['long',fT(ci)+' → '+fT(lo)+' ('+(Math.round((lo-ci)/6)/10)+')']);
 const e0=EMP.find(x=>x.n===n);
 if(e0&&ci!=null){
  const sc=dayS(e0,k,new Date(k+'T00:00:00').getDay());
  if(sc.on){const st=toMin(sc.s);let en=toMin(sc.e);if(en<=st)en+=1440;
   if(!(mn0&&mn0.early)&&((ci>=en&&I.length)||(lo!=null&&lo<=st)))out.push(['outside',fT(ci)+(lo!=null?' – '+fT(lo):'')+' ≠ '+sc.s+'–'+sc.e])}
 }
 return out;
}
function allConf(f,t){
 const out=[];
 EMP.forEach((e,ix)=>{if(!e.n)return;
  new Set([...Object.keys(DATA[e.n]||{}),...Object.keys(PR[e.n]||{})]).forEach(k=>{if(k<f||k>t)return;const c=confl(e.n,k);if(c.length)out.push({ix,k,c})})});
 return out.sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:0);
}
function cfBlock(n,k){

["قواعد","التبديل بيتسجل للاتنين مرة واحدة، والموظف ما ينفعش يبقى في تبديلين متداخلين. علامة 🔄 بتظهر على اليوم في التقارير والـ PDF."],
["تنبيه","لو غيّرت اسم الموظف (اسم واتساب) بعد تسجيل التبديل، التبديل القديم بيفقد ارتباطه. امسحه وسجله تاني."]]},
{i:"💬",t:"ملفات واتساب",l:[
["إضافة ملف","zip أو txt من Export الشات بدون وسائط، وتقدر تختار أكتر من ملف مرة واحدة. قبل الدمج بتظهر (تجربة الاستيراد)."],
["تجربة الاستيراد","بتعرض لكل ملف عدد السجلات الجديدة والمكررة والمرفوضة، وسبب الرفض (تاريخ غير صالح أو في المستقبل أو مرسل فاضي)، والتواريخ الجديدة، والمرسلين اللي مش في قايمة الموظفين. ومفيش حاجة بتتدمج إلا لما تضغط دمج."],
["منع التكرار","استيراد نفس ملف المحادثة أكتر من مرة (أو ملف فيه جزء من القديم) ما بيحسبش أي بصمة أو رسالة مرتين. الملف المطابق بالكامل بيتجاهل."],
["تقرير الفروق","قبل الدمج البرنامج بيحسب التقرير قبل وبعد، ويعرض الموظفين اللي اتغيّر عندهم الحضور أو التأخير أو الغياب أو بلا حضور أو الساعات، والأيام اللي اتغيرت. بعد الدمج زر (📋 آخر تقرير فروق) بيفتحه تاني لحد ما تقفل البرنامج."],
["اللي بيتاخد من الملف","أسماء المرسلين وأوقات اللوكيشن المباشر والرسائل النصية. الوسائط لأ."],
["تفعيل وحذف","الصندوق جنب كل ملف بيفعّله أو يوقفه. زر الحذف للملفات اللي ضفتها، والملف المثبّت في البرنامج ما بيتمسحش."],
["مرسلين جداد","زر (إضافة مرسل مش في قايمة الموظفين) بيضيفهم بجدول افتراضي ٩ص إلى ٥م والجمعة راحة، وتعدّله بعدها."]]},
{i:"📝",t:"الرسائل والتوقيع النصي",l:[
["القايمة والفلاتر","كل الرسائل النصية مع بحث وفلتر بالمرسل والحالة (الكل، من غير علامة، حضور، انصراف، المحذوفة) والتاريخ."],
["علامة حضور أو انصراف","حدد الرسائل (أو تحديد الكل) واضغط علامة الحضور أو الانصراف. بتتحول لتوقيع نصي بيتدمج في الحساب."],
["إزاي بيتدمج","الحضور = أبكر وقت بين اللوكيشن والتوقيع. الانصراف = أخير وقت بينهم."],
["تعيين لموظف","(تعيين المحدد لموظف) بيحسب التوقيع لموظف غير اللي كتب الرسالة. الافتراضي هو اللي كتبها لو موجود في القايمة."],
["الكشف التلقائي","بيعلّم الرسائل اللي فيها كلمات زي وصل وحضر وجيت (حضور) ونزل وانصرف ومشي وخرج (انصراف). بيسألك قبل ما يطبّق."],
["حذف واسترجاع","الرسائل اللي مالهاش لازمة تتحذف وما بتتحسبش، وتقدر ترجّعها من فلتر المحذوفة."],
["من التقرير","زر 🔍 توقيع نصي جنب اليوم المتأخر أو الغياب، وزر 💬 رسائل اليوم في ورقة اليوم، بيفتحوا رسائل اليوم ده على طول."],
["PDF","تصدير القايمة الحالية، أو التوقيعات بس."]]},
{i:"📊",t:"لوحة الملخص",u:1,l:[
["الفترات","آخر يوم أو الأسبوع أو الشهر أو الكل. كلها محسوبة من آخر يوم في البيانات مش من تاريخ النهاردة."],
["الكروت","حضور مكتمل، تأخير، غياب، بلا حضور، خروج مبكر، أيام من غير انصراف، تعارضات، وساعات العمل."],
["دونات نسبة الحضور","النسبة = حاضر ÷ (حاضر + غياب). الأخضر في الميعاد، البرتقالي تأخير، الأحمر غياب."],
["الرسم على الأيام","أعمدة لكل يوم، وبتتجمّع بالشهور لو الفترة أطول من ٣١ يوم."],
["كروت الأقسام","لكل فئة: عدد الموظفين وفي الميعاد والتأخير والغياب."],
["سجّلوا حضورهم","في وضع آخر يوم بس: قايمة بوقت الدخول والخروج وحالة كل موظف."],
["تحتاج مراجعة","أحدث الأيام اللي فيها تأخير أو خروج مبكر أو من غير انصراف أو غياب. اضغط على أي بند لتفاصيل اليوم."],
["تنبيه","الغياب بيتحسب بعد ما اليوم يخلص، فآخر يوم في البيانات ما بيظهرش فيه غياب."]]},
{i:"⚠️",t:"كشف التعارضات",u:1,l:[
["تكرار","حضور أو انصراف مسجل مرتين ورا بعض من غير النوع التاني بينهم. دخول وخروج وبعدين دخول وخروج تاني (راحة) مش تعارض."],
["رسالة معلّمة الاتنين","رسالة واحدة معلّمة حضور وانصراف مع بعض."],
["خارج الوردية","حضور بعد نهاية الوردية المقررة لليوم ده، أو انصراف قبل بدايتها. غالباً وردية غلط أو تبديل مش مسجل."],
["مدة أطول من ١٦ ساعة","بين أول حضور وآخر انصراف. غالباً نسيان انصراف أو توقيع على يوم غلط."],
["فين بتظهر","كارت وقايمة في اللوحة، وعلامة ⚠️ في التقويم والجدول، وصندوق أحمر في ورقة اليوم. زر (الكل) في اللوحة بيفحص كل البيانات."],
["الحل","افتح (رسائل اليوم) من ورقة اليوم وصحّح علامات الحضور والانصراف."]]},
{i:"📅",t:"الجدول الشهري والتقويم وتفاصيل اليوم",u:1,l:[
["جدول الفريق الشهري","في عرض (كل الموظفين): صف لكل موظف وعمود لكل يوم بمربعات ملونة، وأعمدة حضور وتأخير وغياب، وصف عدد الحاضرين كل يوم."],
["تقويم الموظف","في عرض (موظف): تقويم الشهر بألوان الأيام. علامة ! لحضور من غير انصراف، 🔄 لتبديل، ⚠️ لتعارض."],
["الألوان","أخضر حضور، برتقالي تأخير، أحمر غياب، رمادي راحة، وإطار أحمر منقّط (∅) بلا حضور."],
["ورقة اليوم","اضغط على أي يوم (في التقويم أو الجدول أو القايمة): الميعاد والحضور والانصراف والتأخير والخروج المبكر والساعات والنقص، وكل الرسائل والتوقيعات المسجلة."],
["مصدر كل توقيت","جنب وقت الحضور والانصراف أيقونة بتوضح مصدره: 📍 موقع مباشر، 💬 رسالة نصية معتمدة (توقيع نصي)، ✏️ تعديل يدوي. بتظهر في تفاصيل الموظف وورقة اليوم والـ PDF."],
["التعديل اليدوي","من ورقة اليوم اضغط ✏️ تعديل يدوي واكتب وقت الحضور و/أو الانصراف الصح مع ملاحظة. التعديل بيحل محل الأوقات المسجلة لليوم ده بس، وما بيطلعش على اليوم تعارضات، وبيتحفظ في النسخة الاحتياطية. لو مسحته الأوقات الأصلية بترجع."],
["الأسهم","بتغيّر الشهر، وهي مشتركة بين الجدول الشهري والتقويم."]]},
{i:"📈",t:"التقارير والتصدير",u:1,l:[
["الفترة","من وإلى، واختصارات: الكل والسنة والشهر والشهر اللي فات."],
["العرض","كل الموظفين أو موظف واحد، وفلتر الفئة، وتجميع يومي أو شهري أو سنوي."],
["دقايق السماح","التأخير والخروج المبكر بيتحسبوا بعد الدقايق دي بس."],
["🏆 ترتيب الالتزام","ترتيب الموظفين بنسبة الالتزام، مع الحضور والتأخير ودقايق التأخير والخروج المبكر والغياب. فيه زر طباعة."],
["👁 إخفاء الأسماء","بيستبدل الأسماء بأرقام للعرض أو الطباعة."],
["✅ مراجعة قبل الاعتماد","بتفحص الفترة المختارة وتعرض: أيام من غير حضور أو انصراف، والتعارضات، وأيام من غير بيانات لأي موظف (غالباً الملف ما غطّاهاش)، وموظفين بجدول ومن غير أي تسجيل (غالباً اسم واتساب غلط)، ورسائل شكلها حضور أو انصراف ومش معلّمة. بعدين (اعتماد التقرير) بيسجل الفترة والوقت وبصمة للبيانات، وبيوريك بعدين لو البيانات اتغيرت بعد الاعتماد."],
["PDF","الشامل، أو الموظف ده، أو صفحة لكل موظف. علامة 🔄 بتظهر على الأيام المتبدّلة."],
["جدول تفاصيل الموظف","جنب كل يوم متأخر أو غياب زر 🔍 توقيع نصي وزر 🔄 تبديل. والضغط على التاريخ نفسه بيفتح ورقة اليوم."]]},
{i:"📐",t:"طريقة الحساب",u:1,l:[
["يوم العمل","بيتحدد حسب وردية كل موظف مش قاعدة واحدة للكل. الموظف النهاري: أي وقت قبل ٤ الفجر (أو قبل بداية ورديته بنص ساعة لو بتبدأ بدري) بيتحسب لليوم اللي قبله. والموظف اللي ورديته الليلية بتخلص الصبح بيمتد عنده اليوم لحد ساعتين بعد نهاية الوردية."],
["الحضور","أول لوكيشن في يوم العمل، أو توقيع الحضور لو أبكر."],
["الانصراف","آخر لوكيشن أو توقيع انصراف، بشرط تكون المدة بعد الحضور ساعة على الأقل ونص ساعات اليوم المطلوبة على الأقل، وإلا اليوم بيتحسب من غير انصراف."],
["بلا حضور","يوم فيه توقيع انصراف بس ومفيش لوكيشن ولا توقيع حضور. بيظهر بحالة (بلا حضور)، وما بيتحسبش حضور ولا غياب، وليه عمود وكارت لوحده."],
["التأخير والخروج المبكر","التأخير = الحضور بعد ميعاد البداية بأكتر من دقايق السماح. الخروج المبكر = قبل النهاية بأكتر من السماح."],
["الساعات","الفعلية والناقصة بتتحسب في الأيام اللي لها انصراف بس."],
["الغياب","يوم عمل من غير أي تسجيل، من أول سجل للموظف لحد اليوم اللي قبل آخر يوم في البيانات."],
["الجداول","بتتطبق على كل التواريخ. التبديل بيغيّر اليوم المحدد بس."]]},
{i:"🛡️",t:"النسخ الاحتياطي والاستعادة",l:[
["الزر","💾 نسخ احتياطي فوق جنب (خصائص). بتظهر عليه نقطة حمرا لما يكون فيه تغييرات بعد آخر نسخة، أو لو ما اتعملتش نسخة أصلاً."],
["حفظ نسخة كاملة","ملف واحد فيه الموظفين وجداولهم وملفات واتساب المضافة (الرسائل والبصمات) وعلامات التوقيع النصي وتبديلات المواعيد والتعديلات اليدوية والاعتمادات والإعدادات. أول ما يتحفظ البرنامج بيفتحه ويقارنه بالبيانات الحالية ويقولك لو فيه مشكلة."],
["التشفير","النسخة مشفّرة. محتاج نفس ملف البرنامج ونفس الرقم السري عشان تفتحها، فاحتفظ بيهم مع النسخة. الملف المثبّت جوه البرنامج مش داخل فيها لأنه جوه الملف نفسه."],
["الاستعادة","اختار ملف النسخة. البرنامج بيختبره الأول: بيفتحه ويتأكد من سلامته ويعرض اللي جواه ومقارنته بالحالي. وبعدين تضغط (تنفيذ الاستعادة)."],
["قبل الاستبدال","الاستعادة بتستبدل البيانات الحالية. فيه خيار (احفظ نسخة من الحالي قبل الاستبدال) متفعّل تلقائي، وبينزّل نسخة من الحالي قبل ما يبدّل."],
["تغيير الجهاز أو المتصفح","افتح البرنامج بنفس الملف والرقم السري على الجهاز أو المتصفح الجديد، واضغط 💾 نسخ احتياطي ثم استعادة واختار آخر نسخة."],
["ملف الإعدادات القديم","(حفظ الإعدادات) في تاب الموظفين بيحفظ الإعدادات بس من غير رسائل واتساب. تقدر تستعيده من نفس زر الاستعادة، والملفات الحالية بتفضل زي ما هي."],
["تخزين دائم","البرنامج بيطلب من المتصفح ما يمسحش بياناته، وبيعرض في نافذة النسخ لو اتفعّل. ده مش ضمان، فالنسخة الاحتياطية هي الأمان الحقيقي."],
["نصيحة","انسخ الملف على Drive أو ابعته لنفسك على واتساب، وخصوصاً بعد أي إضافة كبيرة."]]},
{i:"🔐",t:"الصلاحيات والإعدادات",u:1,l:[
["القفل","البرنامج بيتفتح برقم سري. فيه صلاحية كاملة وصلاحية عرض التقارير بس."],
["اللغة","زر اللغة فوق بيبدّل بين العربي والإنجليزي."],
["الوضع الليلي","بيتغير تلقائي حسب إعدادات جهازك."],
["التقويم والتواريخ","الأسبوع بيبدأ من السبت في كل التقاويم، ومنتقي التواريخ (من / إلى والتبديل وفلتر الرسائل)، وفي ترتيب الأيام في الجداول."],
["مكان الحفظ","الإعدادات والتبديلات والعلامات بتتحفظ في متصفح الجهاز ده. خد نسخة كاملة من زر 💾 نسخ احتياطي قبل ما تغيّر الجهاز أو تمسح بيانات المتصفح."]]}
],
en:[
{i:"🚀",t:"Quick start",l:[
["1) Employees","In the 👥 tab add employees and set their schedules. The name must match the sender name in the WhatsApp group exactly."],
["2) WhatsApp files","Export the chat from WhatsApp without media and add the zip or txt file in the 💬 tab."],
["3) Reports","Open the 📊 tab for the dashboard and reports. Tap any day or employee for details."],
["4) Text sign-off","If someone sends a message like (arrived) or (leaving), mark it as check-in or check-out in the 📝 tab."],
["5) Backup","Press 💾 Backup (top) and save a full copy now and then, somewhere else. Everything is stored in this browser on this device only."]]},
{i:"👥",t:"Employees & schedules",l:[
["Add and delete","(+ Add employee) adds one. Tick the ones to remove and press Delete selected."],
["Name and display name","The name must match the WhatsApp sender. The display name is optional and is what appears in reports and PDFs."],
["Renaming a WhatsApp name","When you rename an employee a warning shows what is affected: shift swaps, text sign-off marks, manual edits and chat records. You can update the links automatically or rename only. Chat records link by the WhatsApp name only, so if the new name is not the sender name they get detached from the employee."],
["Category","MRI, CT, Secretarial, Cashier or none. Departments are grouped by it in the dashboard and reports."],
["Schedule","Open Schedule for each employee and set work days, start, end and hours per day. You can set all days at once. Night shifts that end the next day are supported."],
["Display","Group by category or flat list, expand or collapse all."],
["Employee summary","A table with name, phone, category, in/out times, hours and days off for everyone, with print and a button to hide phone numbers."],
["Reset defaults","Restores the original built-in employees."],
["Save and load settings","A file with employees, schedules, text sign-off marks and shift swaps. All of them are also kept automatically in the browser."]]},
{i:"🔄",t:"Shift swap",l:[
["From the Employees tab","Pick the date (and To for several days) and both employees. Each is calculated on the other's schedule for those days only."],
["For past days","From a report: next to the day in the employee details, calendar or day sheet, press 🔄 Swap and pick who swapped."],
["Undo","Pressing 🔄 on a swapped day offers to delete the swap. The swap list also has a delete button."],
["Rules","A swap is saved for both people at once, and an employee cannot be in two overlapping swaps. The 🔄 mark appears on the day in reports and PDFs."],
["Note","If you rename an employee (WhatsApp name) after saving a swap, the old swap loses its link. Delete it and add it again."]]},
{i:"💬",t:"WhatsApp files",l:[
["Adding a file","zip or txt from a chat export without media. You can pick several files at once. Before merging the (Import preview) appears."],
["Import preview","For each file it shows how many records are new, duplicate and rejected, why they were rejected (invalid date, future date or empty sender), the new dates and senders that are not in the employee list. Nothing is merged until you press Merge."],
["Duplicate protection","Importing the same chat file again (or a file containing part of the old one) never counts a punch or message twice. A file identical to an existing one is ignored."],
["Diff report","Before merging the app computes the report before and after and shows the employees whose present, late, absent, no check-in or hours changed, and the days that changed. After merging, (📋 Last diff report) reopens it until you close the app."],
["What is read","Sender names, live-location times and text messages. No media."],
["Use and delete","The checkbox next to a file turns it on or off. Delete works for files you added; the built-in file cannot be deleted."],
["New senders","The button (Add senders not in the employee list) adds them with a default 9 AM to 5 PM schedule and Friday off. Edit it afterwards."]]},
{i:"📝",t:"Messages & text sign-off",l:[
["List and filters","All text messages with search and filters by sender, status (all, unmarked, check-in, check-out, deleted) and date."],
["Mark check-in or check-out","Select messages (or Select all) and press the mark button. They become a text sign-off that is merged into the calculation."],
["How it merges","Check-in = earliest time between location and sign-off. Check-out = latest time between them."],
["Assign to employee","(Assign selected to employee) credits the sign-off to someone other than the sender. Default is the sender if they are in the list."],
["Auto-detect","Marks messages with words like arrived, here (check-in) and left, leaving (check-out), and Arabic equivalents. It asks before applying."],
["Delete and restore","Useless messages can be deleted and are not counted. Restore them from the Deleted filter."],
["From a report","The 🔍 Text sign-off button next to a late or absent day, and 💬 Day messages in the day sheet, open that day's messages directly."],
["PDF","Export the current list, or sign-offs only."]]},
{i:"📊",t:"Dashboard",u:1,l:[
["Periods","Latest day, week, month or all. All are counted from the last day in the data, not from today's date."],
["Cards","Complete attendance, late, absent, no check-in, early leave, days with no check-out, conflicts and work hours."],
["Attendance donut","Rate = present ÷ (present + absent). Green on time, orange late, red absent."],
["Chart by day","A bar per day, grouped by month when the period is longer than 31 days."],
["Department cards","Per category: employee count, on time, late and absent."],
["Logged in","Latest-day mode only: a list with in/out times and status for each employee."],
["Needs review","Most recent days with lateness, early leave, missing check-out or absence. Tap any item for the day details."],
["Note","Absence is counted once the day is over, so the last day in the data shows no absences."]]},
{i:"⚠️",t:"Conflict detection",u:1,l:[
["Repeats","Two check-ins or two check-outs in a row with none of the other kind between them. In, out, in, out again (a break) is not a conflict."],
["One message, both marks","A single message marked as both check-in and check-out."],

function swInfo(){

  const e=EMP.find(x=>x.n===n);if(!e){box.innerHTML='';return}

  }).join('');
  box.innerHTML=`<div class="swi">${head}${body}${more?`<div class="mut">+${more} ${tr('swi_more')}</div>`:''}</div>`;
 }catch(err){box.innerHTML=''}
